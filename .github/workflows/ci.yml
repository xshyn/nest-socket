name: CI

on: 
    push: 
        branches: [main]

jobs: 
    build-and-test:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository
              uses: actions/checkout@v4
            
            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                bun-version: latest

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Build
              run: bun run build

            - name: Unit Test
              run: bun run test

            - name: E2E Test
              run: bun run test:e2e
    